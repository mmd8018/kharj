<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="مخارج من"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0b1020">
<title>مخارج من</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--p:#111a2e;--p2:#17223a;--ln:#26334d;--tx:#edf2ff;--mu:#91a0bb;--ac:#8b7cff;--in:#3ddc97;--out:#ff6b7a;--am:#ffc857}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 90% -10%,#25245a,transparent 35%),var(--bg);color:var(--tx);font:14px/1.7 Vazirmatn,Tahoma,sans-serif;padding-bottom:84px;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--ln);background:var(--p2);border-radius:12px;padding:9px 14px}
button.pri{background:linear-gradient(135deg,#7668f5,#4f8be9);border:0;font-weight:700;color:#fff}
input,textarea,select{width:100%;background:#0b1426;border:1px solid var(--ln);border-radius:12px;padding:11px}
.w{max-width:640px;margin:auto;padding:14px}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px}.top select{width:auto;flex:1}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.c{background:linear-gradient(145deg,#131e34,#10182a);border:1px solid var(--ln);border-radius:16px;padding:14px}
.c small{color:var(--mu);display:block}.c b{font-size:17px}.in{color:var(--in)}.out{color:var(--out)}
.net{grid-column:1/-1;text-align:center}
.ban{background:#ffc85718;border:1px solid #ffc85755;color:var(--am);width:100%;margin-bottom:12px;text-align:center;padding:12px}
.day{color:var(--mu);font-size:12px;margin:14px 4px 6px}
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:start;margin-bottom:7px;padding:11px 13px;border-radius:14px}
.row .t{flex:1;min-width:0}.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--mu)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.new{border-color:#ffc85766}
.bar{height:8px;border-radius:8px;background:var(--ac);margin-top:5px}
.nav{position:fixed;bottom:0;inset-inline:0;display:flex;gap:6px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#0b1020ee;border-top:1px solid var(--ln)}
.nav button{flex:1}.nav .on{border-color:var(--ac);color:var(--ac)}
.fab{position:fixed;left:18px;bottom:78px;width:54px;height:54px;border-radius:50%;font-size:28px;padding:0}
.sh{position:fixed;inset:0;background:#050914cc;display:none;align-items:flex-end;justify-content:center;z-index:9}.sh.on{display:flex}
.sh>div{background:var(--p);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;border:1px solid var(--ln)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border-radius:99px;padding:4px 12px;font-size:13px}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
label{display:block;margin:12px 0 4px;color:var(--mu);font-size:13px}
.big{font-size:26px;font-weight:700;text-align:center;margin:4px 0}
.sms{font-size:12px;color:var(--mu);background:#0b1426;border-radius:10px;padding:8px;direction:rtl;white-space:pre-wrap;max-height:90px;overflow:auto}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg .on{background:var(--ac);border-color:var(--ac);color:#fff}
.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1}
.toast{position:fixed;top:14px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#17243b;border:1px solid #405477;border-radius:12px;padding:9px 16px;z-index:20;display:none}
</style>
</head>
<body>
<div class="w" id="app"></div>
<div class="nav"><button data-v="list">تراکنش‌ها</button><button data-v="rep">گزارش</button><button data-v="set">تنظیمات</button></div>
<button class="fab pri" id="add" aria-label="ثبت دستی">＋</button>
<div class="sh" id="sh"><div id="ed"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),NA=typeof Android!=='undefined';
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const OUT=['خوراک','حمل‌ونقل','قبض و شارژ','خرید','سلامت','تفریح','اجاره و قسط','آموزش','انتقال به خودم','سایر'];
const INC=['حقوق','فروش','هدیه','برگشت وجه','انتقال از خودم','سایر'];
const load=()=>{try{return JSON.parse((NA?Android.load():localStorage.getItem('kh'))||'null')}catch(e){return null}};
let S=load()||{tx:[],unit:'rial',days:60},view='list',mon=null,ed=null,fb='all';
const save=()=>{try{const s=JSON.stringify(S);NA?Android.save(s):localStorage.setItem('kh',s)}catch(e){toast('ذخیره‌سازی در این مرورگر ممکن نیست')}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}
const dg=s=>s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٬،]/g,',');
const M=a=>{const u=S.unit==='toman';return (u?Math.round(a/10):a).toLocaleString('fa-IR')+(u?' تومان':' ریال')};
const mk=ts=>{const p=new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric'}).formatToParts(ts);return +p.find(x=>x.type==='year').value*100+ +p.find(x=>x.type==='month').value};
const mLabel=ts=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'long',year:'numeric'}).format(ts);
const dLabel=ts=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long'}).format(ts);
const tLabel=ts=>new Date(ts).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});

/* تاریخ شمسی داخل پیامک → زمان میلادی */
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+~~(jy/33)*8+~~((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365}let gd=days+1;const sa=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sa[gm];gm++)gd-=sa[gm];return[gy,gm,gd]}
function smsTs(txt,fb){const t=dg(txt),d=t.match(/\b(1[34]\d\d)[\/\-](\d{1,2})[\/\-](\d{1,2})\b/);if(!d)return fb;const[g1,g2,g3]=j2g(+d[1],+d[2],+d[3]),tm=t.match(/(\d{1,2}):(\d{2})/);return new Date(g1,g2-1,g3,tm?+tm[1]:12,tm?+tm[2]:0).getTime()}
/* تشخیص بانک از روی نام فرستنده یا متن پیامک */
const BANKS=[['ملت','ملت|mellat'],['ویپاد','ویپاد|vepod'],['بلو','(?<![آ-ی])بلو(?![آ-ی])|\\bblu\\b'],['تجارت','تجارت|tejarat'],['سپه','سپه|sepah'],['کشاورزی','کشاورزی|keshavarzi'],['شهر','بانک\\s?شهر|shahr\\s?bank|bank\\s?shahr'],['ملی','بانک\\s?ملی|melli'],['صادرات','صادرات|saderat'],['گردشگری','گردشگری|gardeshgari|tourism\\s?bank'],['پست‌بانک','پست\\s?بانک|post\\s?bank|postbank'],['مسکن','بانک\\s?مسکن|maskan'],['اقتصادنوین','اقتصاد\\s?نوین|eghtesad|\\benbank\\b'],['رفاه','بانک\\s?رفاه|refah'],['پارسیان','پارسیان|parsian'],['دی','بانک\\s?دی|bank\\s?day'],['سرمایه','بانک\\s?سرمایه|sarmayeh'],['سینا','بانک\\s?سینا|sina\\s?bank|bank\\s?sina'],['رسالت','رسالت|resalat'],['مهر','بانک\\s?مهر|مهر\\s?ایران|mehr\\s?bank|bank\\s?mehr'],['ملل','بانک\\s?ملل|melal'],['کوثر','بانک\\s?کوثر|kosar|kowsar']].map(([n,r])=>[n,new RegExp(r,'i')]);
const detectBank=m=>{const s=((m.a||'')+' '+(m.b||'')).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ');const f=BANKS.find(([n,r])=>r.test(s));return f?f[0]:'نامشخص'};

/* خواندن پیامک بانکی */
function parse(m){
 let t=dg(m.b||'');
 if(!/(برداشت|واریز|خرید|پرداخت|انتقال|کسر|دریافت|برگشت|مبلغ|[+-]\s?\d)/.test(t))return null;
 let bal=null;const bm=t.match(/(?:مانده|موجودی)[^\d]{0,8}([\d,]+)/);
 if(bm){bal=+bm[1].replace(/,/g,'');t=t.replace(bm[0],' ')}
 t=t.replace(/\d{2,4}[\/\-]\d{1,2}[\/\-]\d{1,2}/g,' ').replace(/\d{1,2}:\d{2}(:\d{2})?/g,' ').replace(/\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{4}/g,' ').replace(/[*#]+\d+/g,' ');
 let amt=null,type=null;
 const sg=t.match(/(^|[\s:])([+-])\s?(\d[\d,]{2,})/);
 if(sg){amt=+sg[3].replace(/,/g,'');type=sg[2]==='+'?'in':'out'}
 else{const n=t.match(/\d{1,3}(,\d{3})+|\d{4,12}/g);if(n)amt=+n[0].replace(/,/g,'')}
 if(!type){const i=/واریز|دریافت|افزایش|برگشت|پرداخت‌?\s?به\s?شما/.test(t),o=/برداشت|خرید|پرداخت|کسر|انتقال/.test(t);type=i&&!o?'in':o&&!i?'out':i?'in':null}
 if(!amt||!type)return null;
 return{amt,type,bal};
}
function importSms(list){
 const ids=new Set(S.tx.map(t=>t.id));let n=0;
 for(const m of list){const p=parse(m);if(!p)continue;const id=m.d+'-'+p.amt+'-'+p.type;if(ids.has(id))continue;ids.add(id);
  S.tx.push({id,ts:m.d,amt:p.amt,type:p.type,bal:p.bal,body:m.b,from:m.a,st:'new',party:'',cat:'',note:'',bank:detectBank(m)});n++}
 save();render();return n;
}
window.syncSms=()=>{if(NA&&Android.hasSms()){const n=importSms(JSON.parse(Android.inbox(S.days||60)));if(n)toast(n+' تراکنش جدید از پیامک‌ها')}};
window.onBack=()=>{if($('#sh').classList.contains('on')){$('#sh').classList.remove('on');return true}if(view!=='list'){view='list';render();return true}return false};

/* نمایش */
const queue=()=>S.tx.filter(t=>t.st==='new').sort((a,b)=>b.ts-a.ts);
const sum=(L,ty)=>L.filter(t=>t.type===ty).reduce((a,t)=>a+t.amt,0);
function group(L,ty,key){const g={};L.filter(t=>t.type===ty).forEach(t=>{const k=t[key]||'(بدون عنوان)';g[k]=(g[k]||0)+t.amt});return Object.entries(g).sort((a,b)=>b[1]-a[1])}
function bars(g,cls){const mx=g.length?g[0][1]:1;return g.length?g.map(([k,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${E(k)}</span><span class="${cls}">${M(v)}</span></div><div class="bar" style="width:${Math.max(4,v/mx*100)}%;background:var(--${cls})"></div></div>`).join(''):'<small style="color:var(--mu)">موردی نیست.</small>'}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 const live=S.tx.filter(t=>t.st!=='skip'),keys=[...new Set(live.map(t=>mk(t.ts)))].sort((a,b)=>b-a);
 const nowK=mk(Date.now());if(!keys.length)keys.push(nowK);if(!keys.includes(mon))mon=keys[0];
 const L=live.filter(t=>mk(t.ts)===mon&&(fb==='all'||t.bank===fb)).sort((a,b)=>b.ts-a.ts),inc=sum(L,'in'),exp=sum(L,'out');
 const sel=`<select id="mon">${keys.map(k=>{const t=live.find(x=>mk(x.ts)===k);return`<option value="${k}"${k===mon?' selected':''}>${mLabel(t?t.ts:Date.now())}</option>`}).join('')}</select>`;
 let h='';
 if(view==='list'){
  const q=queue().length;
  const bk=[...new Set(S.tx.map(t=>t.bank).filter(Boolean))];
  h=`<div class="top">${sel}<button id="imp">${NA?'خواندن پیامک‌ها':'＋ چسباندن پیامک'}</button></div>${bk.length>1?`<div class="top"><select id="fb"><option value="all">همه‌ی بانک‌ها</option>${bk.map(b=>`<option value="${E(b)}"${fb===b?' selected':''}>${E(b)}</option>`).join('')}</select></div>`:''}
  <div class="sum"><div class="c"><small>دریافتی</small><b class="in">${M(inc)}</b></div><div class="c"><small>هزینه</small><b class="out">${M(exp)}</b></div><div class="c net"><small>تراز ماه</small><b class="${inc>=exp?'in':'out'}">${M(inc-exp)}</b></div></div>
  ${q?`<button class="ban" id="ask">${q.toLocaleString('fa-IR')} تراکنش منتظر ثبت است — بزن تا جواب بدهی</button>`:''}`;
  let last='';
  for(const t of L){const d=dLabel(t.ts);if(d!==last){h+=`<div class="day">${d}</div>`;last=d}
   h+=`<button class="c row${t.st==='new'?' new':''}" data-id="${t.id}"><span class="dot" style="background:var(--${t.type})"></span><span class="t"><div>${E(t.party||(t.st==='new'?'ثبت نشده':'بدون عنوان'))}</div><small>${E(t.cat||'—')} · ${tLabel(t.ts)}${t.bank&&t.bank!=='نامشخص'?' · '+E(t.bank):''}</small></span><b class="${t.type}">${t.type==='in'?'+':'−'}${M(t.amt)}</b></button>`}
  if(!L.length)h+='<div class="c" style="text-align:center;color:var(--mu)">هنوز تراکنشی نیست. پیامک بانکی را از دکمه‌ی بالا اضافه کن یا با ＋ دستی ثبت کن.</div>';
 }else if(view==='rep'){
  h=`<div class="top">${sel}</div><div class="c"><b>هزینه‌ها بر اساس دسته</b>${bars(group(L,'out','cat'),'out')}</div>
  <div class="c" style="margin-top:10px"><b>بیشترین مقصدها</b>${bars(group(L,'out','party').slice(0,8),'out')}</div>
  <div class="c" style="margin-top:10px"><b>دریافتی‌ها بر اساس منبع</b>${bars(group(L,'in','party').slice(0,8),'in')}</div>`;
 }else{
  h=`<div class="c"><label>واحد نمایش مبلغ (بانک‌ها به ریال پیامک می‌زنند)</label><div class="seg" id="unit"><button data-u="rial" class="${S.unit==='rial'?'on':''}">ریال</button><button data-u="toman" class="${S.unit==='toman'?'on':''}">تومان</button></div>
  <label>خواندن پیامک‌ها از چند روز گذشته</label><select id="days">${[30,60,90,180,365].map(d=>`<option value="${d}"${S.days===d?' selected':''}>${d} روز</option>`).join('')}</select></div>
  <div class="c" style="margin-top:10px"><label>پیامک‌های بانکی را اینجا بچسبان (چند پیامک را با یک خط خالی جدا کن)</label><textarea id="paste" rows="6" placeholder="مثلاً: برداشت 1,250,000 مانده 8,430,000"></textarea><div class="btns"><button class="pri" id="pbtn">افزودن</button></div></div>
  <div class="c" style="margin-top:10px"><small>همه‌ی داده‌ها فقط روی همین گوشی می‌ماند.</small><div class="btns"><button id="wipe" style="color:var(--out)">پاک‌کردن همه‌ی داده‌ها</button></div></div>`;
 }
 $('#app').innerHTML=h;
}
$('#app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='imp'&&!NA){view='set';render();return}
 if(b.id==='imp'){if(NA&&Android.hasSms()){const n=importSms(JSON.parse(Android.inbox(S.days||60)));toast(n?n+' تراکنش جدید':'تراکنش جدیدی نبود')}else toast('اجازه‌ی خواندن پیامک داده نشده؛ در تنظیمات گوشی فعالش کن یا پیامک را در «تنظیمات» بچسبان.')}
 if(b.id==='ask')openEd(queue()[0].id,true);
 if(b.dataset.id)openEd(b.dataset.id,false);
 if(b.dataset.u){S.unit=b.dataset.u;save();render()}
 if(b.id==='pbtn'){const v=$('#paste').value.trim();if(!v)return;const now=Date.now(),n=importSms(v.split(/\n\s*\n/).map((x,i)=>({a:'paste',b:x.trim(),d:smsTs(x,now-i*1000)})));toast(n?n+' تراکنش اضافه شد':'تراکنشی در این متن پیدا نشد');if(n){$('#paste').value='';view='list';render()}}
 if(b.id==='wipe'){if(b.dataset.s){S.tx=[];save();render()}else{b.dataset.s=1;b.textContent='مطمئنی؟ دوباره بزن'}}});
$('#app').addEventListener('change',e=>{if(e.target.id==='mon'){mon=+e.target.value;render()}if(e.target.id==='fb'){fb=e.target.value;render()}if(e.target.id==='days'){S.days=+e.target.value;save()}});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
$('#add').onclick=()=>openEd(null,false);

/* پرسش از کاربر: از کجا آمده / به کجا رفته */
function openEd(id,qm){
 const t=id?S.tx.find(x=>x.id===id):{id:'m'+Date.now(),ts:Date.now(),amt:0,type:'out',st:'new',party:'',cat:'',note:'',manual:1};
 ed={t:{...t},qm,isNew:!id};draw();$('#sh').classList.add('on');
}
function draw(){
 const t=ed.t,isIn=t.type==='in',cats=isIn?INC:OUT,u=S.unit==='toman';
 const parties=[...new Set(S.tx.filter(x=>x.type===t.type&&x.party).map(x=>x.party))].slice(-40);
 const left=queue().length;
 $('#ed').innerHTML=`${ed.qm?`<small style="color:var(--mu)">${left.toLocaleString('fa-IR')} مورد باقی مانده</small>`:''}
 ${t.manual?`<div class="seg" id="ty"><button data-t="out" class="${!isIn?'on':''}">هزینه</button><button data-t="in" class="${isIn?'on':''}">دریافتی</button></div><label>مبلغ (${u?'تومان':'ریال'})</label><input id="am" type="number" inputmode="numeric" value="${t.amt?(u?t.amt/10:t.amt):''}">`
  :`<div class="big ${t.type}">${isIn?'+':'−'}${M(t.amt)}</div><small style="display:block;text-align:center;color:var(--mu)">${dLabel(t.ts)} · ${tLabel(t.ts)}${t.bal!=null?' · مانده '+M(t.bal):''}${t.bank?' · بانک '+E(t.bank):''}</small>${t.body?`<div class="sms" style="margin-top:8px">${E(t.body)}</div>`:''}`}
 <label>${isIn?'این پول از کجا آمد؟':'این پول به کجا رفت؟'}</label>
 <input id="pa" list="pl" value="${E(t.party)}" placeholder="${isIn?'مثلاً: شرکت، علی، فروش آنلاین':'مثلاً: سوپرمارکت، اسنپ، همراه اول'}" autocomplete="off"><datalist id="pl">${parties.map(p=>`<option value="${E(p)}">`).join('')}</datalist>
 <label>بابت چه؟</label><div class="chips" id="cats">${cats.map(c=>`<button class="chip${t.cat===c?' on':''}" data-c="${c}">${c}</button>`).join('')}</div>
 <label>یادداشت (اختیاری)</label><input id="no" value="${E(t.note)}">
 <div class="btns"><button class="pri" id="ok">${ed.qm?'ثبت و بعدی':'ثبت'}</button>${ed.qm?'<button id="later">بعداً</button><button id="skip" style="color:var(--out)">تراکنش نیست</button>':(ed.isNew?'':'<button id="del" style="color:var(--out)">حذف</button>')}</div>`;
}
function grab(){const t=ed.t;t.party=$('#pa').value.trim();t.note=$('#no').value.trim();if($('#am'))t.amt=Math.round(+$('#am').value*(S.unit==='toman'?10:1))}
$('#ed').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=ed.t;
 if(b.dataset.t){grab();t.type=b.dataset.t;t.cat='';draw()}
 if(b.dataset.c){grab();t.cat=t.cat===b.dataset.c?'':b.dataset.c;draw()}
 if(b.id==='ok'){grab();if(!t.amt)return toast('مبلغ را وارد کن');t.st='done';
  if(ed.isNew){S.tx.push(t)}else Object.assign(S.tx.find(x=>x.id===t.id),t);
  S.tx.forEach(x=>{});save();next()}
 if(b.id==='later'){const i=S.tx.find(x=>x.id===t.id);i.ts=i.ts;skipQ.add(t.id);next()}
 if(b.id==='skip'){S.tx.find(x=>x.id===t.id).st='skip';save();next()}
 if(b.id==='del'){S.tx=S.tx.filter(x=>x.id!==t.id);save();close()}});
$('#ed').addEventListener('change',e=>{if(e.target.id==='pa'&&!ed.t.cat){const p=e.target.value.trim(),h=S.tx.filter(x=>x.party===p&&x.cat&&x.type===ed.t.type).pop();if(h){grab();ed.t.cat=h.cat;draw()}}});
const skipQ=new Set();
function close(){$('#sh').classList.remove('on');render()}
function next(){if(!ed.qm)return close();const n=queue().find(x=>!skipQ.has(x.id));if(!n){skipQ.clear();toast('همه‌ی تراکنش‌ها ثبت شد');return close()}render();ed={t:{...n},qm:true,isNew:false};draw()}
$('#sh').onclick=e=>{if(e.target.id==='sh')close()};
render();syncSms();
</script>
</body>
</html>
